name: build

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ["21", "25"]
        include:
          - os: windows-latest
            java: "25"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: M0 exit check
        shell: bash
        run: |
          ./gradlew :cellerity-cli:installDist
          test "$(cellerity-cli/build/install/cellerity/bin/cellerity eval corpus/samples/synthetic/sample.xlsx --get 'Sheet1!A1' | tr -d '\r')" = "42"
      - name: M2 exit check
        shell: bash
        run: |
          cellerity-cli/build/install/cellerity/bin/cellerity verify corpus/samples/poi/VLookupFullColumn.xlsx --report verify-report.html
          grep -q "Fidelity 100.0000%" verify-report.html
          test "$(cellerity-cli/build/install/cellerity/bin/cellerity eval corpus/samples/synthetic/sample.xlsx --set CoverAmount=1000 --get 'Sheet1!B2' | tr -d '\r')" = "35"
