name: eval

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # Fails if a file crashes the reader or fails its checksum, or a metric drops below its baseline.
      - run: make eval
      # Fails on any disagreement with POI, low coverage, or a modified corpus file.
      - run: make crosscheck
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-load
          path: eval/results/latest-*.json

  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # Logs and artifacts are public. Only POI's public test data gets a detail file, never Enron
      # (ADR-0013).
      - run: make -k fidelity FIDELITY_HEAP=8g
      - name: Incremental recalculation agrees with a full one
        run: make recalc FIDELITY_HEAP=8g
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fidelity
          path: |
            eval/results/latest-fidelity-*.json
            eval/results/latest-recalc.json
            eval/results/latest-report-*.html
            eval/results/latest-detail-poi.tsv
