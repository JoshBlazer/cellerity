name: eval

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # Fails if any corpus file crashes the reader or fails its checksum.
      - run: make eval
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-load
          path: eval/results/latest-corpus-load.json
