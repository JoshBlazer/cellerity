[versions]
junit = "6.1.3"
jqwik = "1.10.2"
errorprone = "2.52.0"
poi = "6.0.0"
truffle = "25.0.5"
jmh = "1.37"
spotlessPlugin = "8.11.0"
errorpronePlugin = "5.2.0"

[libraries]
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
truffle-api = { module = "org.graalvm.truffle:truffle-api", version.ref = "truffle" }
truffle-runtime = { module = "org.graalvm.truffle:truffle-runtime", version.ref = "truffle" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-processor = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotlessPlugin" }
errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorpronePlugin" }
